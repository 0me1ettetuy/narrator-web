name: narrator-web-${ENVIRONMENT:?Set ENVIRONMENT}

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB}
    volumes:
      - narrator_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 3s
      retries: 10
  
  backup:
    image: postgres:16-alpine
    profiles: ['tools']
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER:?Set POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB:?Set POSTGRES_DB}
      BACKUP_DIR: /var/backups/postgres
      RETENTION_DAYS: 7
    volumes:
      - ${POSTGRES_BACKUP_DIR:-/var/backups/narrator-web/postgres}:/var/backups/postgres
      - ./docker/backup/backup.sh:/usr/local/bin/backup.sh:ro
    entrypoint: ['/bin/sh', '/usr/local/bin/backup.sh']
    depends_on:
      db:
        condition: service_healthy

  server:
    image: narrator-server:${ENVIRONMENT}
    build:
      context: .
      dockerfile: apps/server/Dockerfile
      args:
        DATABASE_URL_DIRECT: ${DATABASE_URL_DIRECT:?Set DATABASE_URL_DIRECT}
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: ${PORT:?Set PORT}
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL}
      DATABASE_URL_DIRECT: ${DATABASE_URL_DIRECT:?Set DATABASE_URL_DIRECT}
      DATABASE_ADAPTER: ${DATABASE_ADAPTER:?Set DATABASE_ADAPTER}
      CLIENT_ORIGIN: ${CLIENT_ORIGIN:?Set CLIENT_ORIGIN}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Set BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:?Set BETTER_AUTH_URL}
    ports:
      - '${SERVER_PUBLISHED_PORT:?Set SERVER_PUBLISHED_PORT}:${PORT:?Set PORT}'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "const port = process.env.PORT || 3000; fetch('http://127.0.0.1:' + port + '/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 60s
      timeout: 3s
      retries: 10
    depends_on:
      db:
        condition: service_healthy

  client:
    image: narrator-client:${ENVIRONMENT}
    build:
      context: .
      dockerfile: apps/client/Dockerfile
      args:
        DATABASE_URL_DIRECT: ${DATABASE_URL_DIRECT:?Set DATABASE_URL_DIRECT}
        VITE_BACKEND_URL: ${VITE_BACKEND_URL:?Set VITE_BACKEND_URL}
    restart: unless-stopped
    ports:
      - '${CLIENT_PUBLISHED_PORT:?Set CLIENT_PUBLISHED_PORT}:80'
    depends_on:
      server:
        condition: service_healthy
  
