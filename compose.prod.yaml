name: narrator-web-${ENVIRONMENT:?Set ENVIRONMENT}

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB}
    volumes:
      - narrator_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 3s
      retries: 10

  server:
    image: narrator-server:${ENVIRONMENT}
    build:
      context: .
      dockerfile: apps/server/Dockerfile
      args:
        DATABASE_URL_DIRECT: ${DATABASE_URL_DIRECT:?Set DATABASE_URL_DIRECT}
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: ${PORT:?Set PORT}
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL}
      DATABASE_URL_DIRECT: ${DATABASE_URL_DIRECT:?Set DATABASE_URL_DIRECT}
      DATABASE_ADAPTER: ${DATABASE_ADAPTER:?Set DATABASE_ADAPTER}
      CLIENT_ORIGIN: ${CLIENT_ORIGIN:?Set CLIENT_ORIGIN}
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:?Set AUTH_JWT_SECRET}
      AUTH_ACCESS_TOKEN_TTL_SECONDS: ${AUTH_ACCESS_TOKEN_TTL_SECONDS:?Set AUTH_ACCESS_TOKEN_TTL_SECONDS}
      AUTH_REFRESH_TOKEN_TTL_DAYS: ${AUTH_REFRESH_TOKEN_TTL_DAYS:?Set AUTH_REFRESH_TOKEN_TTL_DAYS}
      AUTH_BCRYPT_ROUNDS: ${AUTH_BCRYPT_ROUNDS:?Set AUTH_BCRYPT_ROUNDS}
    ports:
      - '${SERVER_PUBLISHED_PORT:?Set SERVER_PUBLISHED_PORT}:${PORT:?Set PORT}'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "const port = process.env.PORT || 3000; fetch('http://127.0.0.1:' + port + '/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 60s
      timeout: 3s
      retries: 10
    depends_on:
      db:
        condition: service_healthy

  client:
    image: narrator-client:${ENVIRONMENT}
    build:
      context: .
      dockerfile: apps/client/Dockerfile
      args:
        DATABASE_URL_DIRECT: ${DATABASE_URL_DIRECT:?Set DATABASE_URL_DIRECT}
        VITE_BACKEND_URL: ${VITE_BACKEND_URL:?Set VITE_BACKEND_URL}
    restart: unless-stopped
    ports:
      - '${CLIENT_PUBLISHED_PORT:?Set CLIENT_PUBLISHED_PORT}:80'
    depends_on:
      server:
        condition: service_healthy
  
  kokoro-tts:
    image: ghcr.io/remsky/kokoro-fastapi-cpu:latest
    # image: ghcr.io/remsky/kokoro-fastapi-gpu:latest
    container_name: kokoro-tts
    restart: unless-stopped
    ports:
      - "8880:8880"
    # deploy:
    #   resources:
    #     reservation:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

volumes:
  narrator_postgres_data:
